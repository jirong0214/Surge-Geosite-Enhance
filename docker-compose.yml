services:
  init:
    build:
      context: .
    image: surge-geosite-enhance-api:local
    command: ["node", "scripts/update-vps-data.mjs", "--if-missing"]
    environment: &data-environment
      DATA_ROOT: /data
      BUILD_BINARY_RULESETS: ${BUILD_BINARY_RULESETS:-true}
      SRS_CONCURRENCY: ${SRS_CONCURRENCY:-2}
      MRS_CONCURRENCY: ${MRS_CONCURRENCY:-2}
      KEEP_DATA_VERSIONS: ${KEEP_DATA_VERSIONS:-2}
    volumes:
      - ${DATA_DIR:-./data}:/data
    restart: "no"

  api:
    image: surge-geosite-enhance-api:local
    environment:
      DATA_ROOT: /data
      PORT: 8787
      PUBLIC_PORT: ${HTTP_PORT:-8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  updater:
    image: surge-geosite-enhance-api:local
    command: ["node", "scripts/update-vps-data.mjs", "--loop"]
    environment:
      <<: *data-environment
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-86400}
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    image: surge-geosite-enhance-web:local
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
