proxy_cache_path /var/cache/nginx/surge levels=1:2 keys_zone=surge_cache:10m max_size=512m inactive=1d use_temp_path=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  location = /healthz {
    proxy_pass http://api:8787/healthz;
  }

  location ~ ^/(api|geosite|geoip|srs|srs-geosite|srs-geoip|mihomo|egern|misc|github)(/|$) {
    proxy_pass http://api:8787$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache surge_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30m;
    proxy_cache_valid 404 1m;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
